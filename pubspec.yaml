
name: persipal_app
description: Persian Cat Care Companion - Virtual pet, learning, and care management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # Local Storage (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notification
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # External links (Lesson references)
  url_launcher: ^6.3.1

  # Pet profile photos
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.4

  # UI
  flutter_animate: ^4.5.0
  flame: ^1.38.2
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_core_platform_interface: 6.0.3

flutter:
  uses-material-design: true

  assets:
